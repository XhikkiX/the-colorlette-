<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>404 — the colorlette°</title>
<style>
:root{--bg:#f6f5f1;--ink:#171717;--muted:#77736b;--line:rgba(23,23,23,.1);--card:rgba(255,255,255,.72);--shadow:0 30px 90px rgba(30,25,18,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{display:grid;place-items:center;overflow:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(50px);pointer-events:none;opacity:.5}body:before{width:360px;height:360px;left:-140px;top:-100px;background:#ffd5cf}body:after{width:380px;height:380px;right:-160px;bottom:-140px;background:#ddd6ff}
main{width:min(900px,calc(100% - 32px));position:relative}.card{position:relative;min-height:min(680px,calc(100vh - 32px));display:flex;flex-direction:column;justify-content:center;padding:58px;border:1px solid var(--line);border-radius:36px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow:hidden}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;letter-spacing:-.03em}.brand svg{width:78px;height:34px}.brand circle:nth-child(1){fill:#ff6b5e}.brand circle:nth-child(2){fill:#ff9f5e}.brand circle:nth-child(3){fill:#f5d76e}.brand circle:nth-child(4){fill:#1fc2b8}.brand circle:nth-child(5){fill:#7457ff}
.art{position:absolute;width:420px;height:420px;right:-35px;top:50%;transform:translateY(-50%);opacity:.96}.orb{transform-origin:center;animation:float 6s ease-in-out infinite}.orb:nth-child(2){animation-delay:-1.5s}.orb:nth-child(3){animation-delay:-3s}.orb:nth-child(4){animation-delay:-4.5s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.content{position:relative;z-index:2;width:min(480px,100%)}.code{font-size:clamp(86px,15vw,150px);line-height:.8;font-weight:800;letter-spacing:-.09em;margin:80px 0 28px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:linear-gradient(100deg,#ff6b5e 0%,#ff9f5e 28%,#1fc2b8 62%,#7457ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:12px}.title{font-size:clamp(30px,5vw,48px);line-height:1.03;letter-spacing:-.055em;margin:0 0 16px}.copy{font-size:16px;line-height:1.65;color:var(--muted);max-width:430px;margin:0 0 28px}.back{display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border:1px solid var(--ink);border-radius:14px;background:var(--ink);color:#fff;text-decoration:none;font-size:13px;font-weight:750;transition:transform .2s,box-shadow .2s}.back:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,20,20,.16)}.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:720px){body{overflow:auto}.card{min-height:calc(100vh - 22px);padding:28px 24px;border-radius:28px}.art{width:300px;height:300px;right:-90px;top:35%;opacity:.7}.code{margin-top:88px}.content{max-width:100%}.copy{font-size:15px}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<main>
<section class="card">
  <div class="brand"><svg viewBox="0 0 80 40" aria-hidden="true"><circle cx="13" cy="20" r="11"/><circle cx="26" cy="20" r="11"/><circle cx="39" cy="20" r="11"/><circle cx="52" cy="20" r="11"/><circle cx="65" cy="20" r="11"/></svg><span>the colorlette°</span></div>
  <svg class="art" viewBox="0 0 420 420" aria-hidden="true">
    <g class="orb"><circle cx="150" cy="190" r="92" fill="#ff6b5e" opacity=".92"/><circle cx="275" cy="160" r="78" fill="#ff9f5e" opacity=".82"/></g>
    <g class="orb"><circle cx="280" cy="275" r="94" fill="#7457ff" opacity=".78"/><circle cx="140" cy="292" r="72" fill="#1fc2b8" opacity=".82"/></g>
    <circle class="orb" cx="220" cy="105" r="30" fill="#f5d76e"/>
    <path d="M88 365c76-40 184-39 252 0" fill="none" stroke="rgba(23,23,23,.08)" stroke-width="2"/>
  </svg>
  <div class="content">
    <div class="code">404</div>
    <div class="eyebrow">A color took a wrong turn</div>
    <h1 class="title">This page wandered outside the palette.</h1>
    <p class="copy">The color is still out there somewhere. The studio is right this way.</p>
    <a class="back" href="./"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Back to the studio</span></a>
  </div>
</section>
</main>
</body>
</html>
